name: ai-review

# Runs only after CI is green on a factory branch of THIS repo. It can only block.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: ai-review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Mark pending
        id: ctx
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=ai-review -f description="Reviewing" >/dev/null
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          skipped=false
          [ -n "$pr" ] && gh pr view "$pr" --json labels -q '[.labels[].name] | join(",")' | grep -q nwave-skipped && skipped=true
          echo "nwave_skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r .reviewer_model factory/config.json)" >> "$GITHUB_OUTPUT"
          echo "turns=$(jq -r .reviewer_max_turns factory/config.json)" >> "$GITHUB_OUTPUT"
          mkdir -p factory-out
          key=$(printf %s "$CONTEXT7_API_KEY" | tr -d '[:space:]')
          headers='{}'
          if [ -n "$key" ]; then
            # Fall back to anonymous access if Context7 rejects the key, rather than breaking the run.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://mcp.context7.com/mcp \
              -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gaffer-ci","version":"1"}}}')
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::warning::CONTEXT7_API_KEY rejected (HTTP $code); using anonymous Context7"
            else
              headers=$(jq -n --arg k "$key" '{Authorization: ("Bearer " + $k)}')
            fi
          fi
          jq -n --argjson h "$headers" '{mcpServers: {context7: {type: "http", url: "https://mcp.context7.com/mcp", headers: $h}}}' > "$RUNNER_TEMP/mcp.json"
          { echo "text<<PROMPT_EOF"; cat factory/review-prompt.md; echo "PROMPT_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Claude reviewer (different tier from crafter)
        if: steps.ctx.outputs.nwave_skipped != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.ctx.outputs.text }}
          claude_args: >-
            --mcp-config ${{ runner.temp }}/mcp.json
            --model ${{ steps.ctx.outputs.model }}
            --max-turns ${{ steps.ctx.outputs.turns }}
            --allowedTools "Read,Glob,Grep,LS,Write,Skill,Task,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git status:*),mcp__context7"
            --disallowedTools "Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,Bash(gh:*),Bash(curl:*),Bash(git push:*),Bash(git commit:*),Bash(git checkout:*),Bash(git reset:*)"

      - name: Publish verdict
        if: always()
        env:
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          verdict=$(jq -r '.verdict // "missing"' factory-out/review.json 2>/dev/null || echo missing)
          if [ "${{ steps.ctx.outputs.nwave_skipped }}" = "true" ]; then verdict=nwave; fi
          case "$verdict" in
            nwave)   state=failure; desc="Blocked: this run skipped the required nWave commands" ;;
            approve) state=success; desc="No blocking findings" ;;
            block)   state=failure; desc="Blocking findings - see PR comment" ;;
            *)       state=error;   desc="Reviewer produced no verdict" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state -f context=ai-review -f description="$desc" >/dev/null
          if [ -n "$PR" ] && [ "$verdict" = "block" ]; then
            {
              echo "<!-- ai-review -->"
              echo "### AI review: blocking findings"
              jq -r '.findings[] | "- `\(.file):\(.line)` **\(.reason)**: \(.detail)"' factory-out/review.json
            } > comment.md
            gh pr comment "$PR" --body-file comment.md
          fi
