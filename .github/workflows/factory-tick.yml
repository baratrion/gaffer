name: factory-tick

# Every 2 hours, around the clock. The preflight's real-usage gate (factory/config.json "usage")
# decides whether a run actually happens, so daytime runs back off when the owner is busy.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: factory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      checks: read
    outputs:
      run: ${{ steps.pre.outputs.run }}
      mode: ${{ steps.pre.outputs.mode }}
      story_id: ${{ steps.pre.outputs.story_id }}
      story_title: ${{ steps.pre.outputs.story_title }}
      pr: ${{ steps.pre.outputs.pr }}
      reason: ${{ steps.pre.outputs.reason }}
      model_override: ${{ steps.pre.outputs.model_override }}
      usage_before: ${{ steps.usage.outputs.json }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - id: usage
        uses: ./.github/actions/usage-probe
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          out: ${{ runner.temp }}/usage-before.json
      - id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_OWNER: ${{ github.repository_owner }}
          USAGE_FILE: ${{ runner.temp }}/usage-before.json
        run: node scripts/factory/preflight.mjs
      - run: echo "### Preflight → run=${{ steps.pre.outputs.run }} — ${{ steps.pre.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  agent:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    env:
      MODE: ${{ needs.preflight.outputs.mode }}
      STORY: ${{ needs.preflight.outputs.story_id }}
      PR: ${{ needs.preflight.outputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false # no git credentials on disk while Claude runs

      - name: Select branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gaffer-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "fix" ]; then
            branch=$(gh pr view "$PR" --json headRefName -q .headRefName)
            git fetch origin "$branch" && git checkout "$branch"
          else
            branch="claude/${STORY}-${GITHUB_RUN_NUMBER}"
            git checkout -b "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "start=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Install nWave (pinned) and verify it loaded
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install "nwave-ai==$(jq -r .nwave_version factory/config.json)"
          nwave-ai install < /dev/null
          nwave-ai project enable
          # nWave 3.22.x bug: its pre-bash hook blocks nWave's own des-* commands (incl. des-commit). Widen the allow pattern.
          python3 scripts/factory/patch-des-hook.py || echo "::warning::DES pre-bash hook not found or format changed (nWave version?)"
          # Unattended: never show expansion menus (documented value for unattended work)
          cfg="$HOME/.nwave/global-config.json"; [ -f "$cfg" ] || echo '{}' > "$cfg"
          jq '.documentation.expansion_prompt = "always-skip"' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
          test -d "$HOME/.claude/skills/nw-deliver" || { echo "::error::nWave skills missing after install"; exit 1; }
          # DES CLIs (des-roadmap, des-init-log, des-log-phase, des-commit, des-verify-integrity) live in ~/.claude/bin
          echo "$HOME/.claude/bin" >> "$GITHUB_PATH"
          ls "$HOME/.claude/bin" | grep '^des-' || echo "::warning::no DES CLIs in ~/.claude/bin"
          # Fail before spending any Claude tokens if nWave is not healthy
          nwave-ai doctor || { echo "::error::nwave-ai doctor failed; not starting Claude"; exit 1; }
          # Keep nWave's machine-local files out of commits (they live under locked paths).
          git status --porcelain
          git diff --name-only | xargs -r git checkout --
          git ls-files --others --exclude-standard | grep -E '^\.nwave/|^\.claude/' >> .git/info/exclude || true

      - name: Fix-mode context (own workflow output only)
        if: env.MODE == 'fix'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          mkdir -p factory-out
          run_id=$(gh run list --workflow ci.yml --branch "$BRANCH" --limit 1 --json databaseId -q '.[0].databaseId')
          gh run view "$run_id" --log-failed | tail -n 400 > factory-out/failures.txt || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-review -->")))] | last | .body // ""' \
            > factory-out/review.md

      - name: Hide protected scenarios from the builder (deliver/fix only)
        if: env.MODE != 'plan'
        run: |
          # skip-worktree: files vanish from the working tree but git never stages their deletion
          git ls-files tests/protected | grep -v README.md | xargs -r git update-index --skip-worktree
          git ls-files tests/protected | grep -v README.md | xargs -r rm -f
          echo "Protected scenarios hidden: $(git ls-files tests/protected | grep -vc README.md) files"

      - name: Render prompt (owner-controlled files only)
        id: prompt
        run: |
          node scripts/factory/render-prompt.mjs "$MODE" "$STORY" "$PR" > /dev/null
          {
            echo "text<<PROMPT_EOF"
            cat factory-out/prompt.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
          role=crafter; [ "$MODE" = "plan" ] && role=planner
          model=$(jq -r ".${role}_model" factory/config.json)
          [ -n "${{ needs.preflight.outputs.model_override }}" ] && model="${{ needs.preflight.outputs.model_override }}" && echo "::notice::Model override: $model (Opus weekly window nearly full)"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          # Permissions: deny list applies in every mode; auto mode adds a safety classifier instead of a fixed allowlist.
          deny="WebFetch,WebSearch,Bash(git push:*),Bash(git remote:*),Bash(git config:*),Bash(git credential:*),Bash(gh:*),Bash(curl:*),Bash(wget:*),Bash(ssh:*),Bash(scp:*),Bash(nc:*),Bash(ncat:*),Bash(telnet:*),Bash(npm publish:*),Bash(pnpm publish:*),Bash(yarn publish:*),Bash(bun publish:*),Read(//home/runner/work/_temp/**),Edit(//home/runner/work/_temp/**),Write(//home/runner/work/_temp/**)"
          if [ "$(jq -r '.permission_mode // "allowlist"' factory/config.json)" = "auto" ]; then
            echo "perm_args=--permission-mode auto --disallowedTools \"$deny\"" >> "$GITHUB_OUTPUT"
          else
            echo "perm_args=--allowedTools \"Read,Write,Edit,MultiEdit,Glob,Grep,LS,Task,Agent,Skill,TodoWrite,Bash(pnpm:*),Bash(npm:*),Bash(npx:*),Bash(bun:*),Bash(bunx:*),Bash(yarn:*),Bash(corepack:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git restore:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(rm:*),Bash(mv:*),Bash(cp:*),Bash(touch:*),Bash(cd:*),Bash(sed:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(find:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(echo:*),Bash(printf:*),Bash(jq:*),Bash(readlink:*),Bash(dirname:*),Bash(basename:*),Bash(python3:*),Bash(sleep:*),Bash(kill:*),Bash(lsof:*),Bash(test:*),Bash(true:*),Bash(xargs:*),Bash(nwave-ai:*),Bash(des-roadmap:*),Bash(des-init-log:*),Bash(des-log-phase:*),Bash(des-commit:*),Bash(des-verify-integrity:*),mcp__context7,mcp__playwright\" --disallowedTools \"$deny\"" >> "$GITHUB_OUTPUT"
          fi
          echo "turns=$(jq -r ".${role}_max_turns" factory/config.json)" >> "$GITHUB_OUTPUT"
          # Effort per role (Thariq Shihipar, "Spending your effort": build at medium from a spec, decide/verify at high when unattended)
          echo "effort=$(jq -r ".${role}_effort // \"medium\"" factory/config.json)" >> "$GITHUB_OUTPUT"

      - name: MCP servers (Context7 docs, Playwright browser restricted to localhost)
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          key=$(printf %s "$CONTEXT7_API_KEY" | tr -d '[:space:]')
          headers='{}'
          if [ -n "$key" ]; then
            # Fall back to anonymous access if Context7 rejects the key, rather than breaking the run.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://mcp.context7.com/mcp \
              -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gaffer-ci","version":"1"}}}')
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::warning::CONTEXT7_API_KEY rejected (HTTP $code); using anonymous Context7"
            else
              headers=$(jq -n --arg k "$key" '{Authorization: ("Bearer " + $k)}')
            fi
          fi
          jq -n --argjson h "$headers" --arg out "$GITHUB_WORKSPACE/factory-out/screens" '{mcpServers: {
            context7:   {type: "http", url: "https://mcp.context7.com/mcp", headers: $h},
            playwright: {command: "npx", args: ["-y", "@playwright/mcp@0.0.83", "--headless", "--isolated",
                         "--allowed-hosts", "localhost,127.0.0.1", "--device", "Pixel 7", "--output-dir", $out, "--caps", "vision"]}
          }}' > "$RUNNER_TEMP/mcp.json"
          mkdir -p factory-out/screens
          # Playwright MCP 0.0.83 bundles playwright 1.64.0-alpha-1790635538000; install the matching Chromium build.
          npx -y playwright-core@1.64.0-alpha-1790635538000 install chromium

      - name: Claude (one nWave step)
        id: claude
        # Hitting the turn cap or this step timeout still leaves useful commits; CI + AI review decide whether they merge.
        # The step timeout is below the job timeout so the publish steps always get to run.
        continue-on-error: true
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: frontend-design@claude-plugins-official
          claude_args: >-
            --mcp-config ${{ runner.temp }}/mcp.json
            --model ${{ steps.prompt.outputs.model }}
            --effort ${{ steps.prompt.outputs.effort }}
            --max-turns ${{ steps.prompt.outputs.turns }}
            ${{ steps.prompt.outputs.perm_args }}

      - name: Usage after the run
        id: usage_after
        if: always()
        uses: ./.github/actions/usage-probe
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          out: factory-out/usage-after.json

      - name: Record what this run cost
        id: cost
        if: always()
        env:
          BEFORE: ${{ needs.preflight.outputs.usage_before }}
          AFTER: ${{ steps.usage_after.outputs.json }}
        run: |
          [ -n "$BEFORE" ] || BEFORE='{"ok":false}'
          [ -n "$AFTER" ] || AFTER='{"ok":false}'
          printf '%s' "$BEFORE" > factory-out/usage-before.json
          line=$(jq -rn --argjson b "$BEFORE" --argjson a "$AFTER" --arg mode "$MODE" '
            if ($b.ok and $a.ok) then
              "usage: 5h \(($b.five_hour*100|round))%→\(($a.five_hour*100|round))%, 7d \(($b.seven_day*100|round))%→\(($a.seven_day*100|round))% (Δ7d \((($a.seven_day-$b.seven_day)*1000|round)/10) pts, \($mode))"
            else "usage: no reading" end')
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "### $line" >> "$GITHUB_STEP_SUMMARY"

      - name: Did this run use nWave?
        id: nwave
        if: always()
        run: |
          t="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$t" ]; then r=$(node scripts/factory/nwave-check.mjs "$MODE" "$t" "$STORY" "${{ steps.branch.outputs.start }}"); else r='{"ok":false,"missing":["no transcript"]}'; fi
          # Hard evidence of DELIVER: code changes for a story must come with nWave's roadmap, DES log and a passing integrity check
          if [ "$MODE" = "deliver" ] && git diff --name-only "${{ steps.branch.outputs.start }}"..HEAD -- src | grep -q .; then
            d="docs/feature/$STORY/deliver"
            why=""
            [ -f "$d/roadmap.json" ] || why="no $d/roadmap.json"
            [ -z "$why" ] && { [ -f "$d/execution-log.json" ] || why="no DES log in $d"; }
            [ -z "$why" ] && { des-verify-integrity "$d/" > factory-out/des-verify.txt 2>&1 || why="des-verify-integrity failed (see factory-out/des-verify.txt)"; }
            [ -n "$why" ] && r=$(echo "$r" | jq -c --arg w "DELIVER evidence: $why" '.ok=false | .missing += [$w]')
          fi
          echo "$r" | tee factory-out/nwave-check.json
          echo "ok=$(echo "$r" | jq -r .ok)" >> "$GITHUB_OUTPUT"
          echo "line=nWave: $(echo "$r" | jq -r '"skills " + (.skills|join(",")) + " · agents " + (.agents|join(",")) + (if (.missing|length)>0 then " · MISSING " + (.missing|join("; ")) else "" end)')" >> "$GITHUB_OUTPUT"

      - name: Keep Claude transcript (encrypted to the owner's age key; artifacts are public)
        if: always()
        run: |
          t="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$t" ] || exit 0
          recipient=$(jq -r '.transcript_recipient // empty' factory/config.json)
          if [ -z "$recipient" ]; then echo "::warning::no transcript_recipient; transcript not kept"; exit 0; fi
          command -v age >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null; }
          age -r "$recipient" -o factory-out/transcript.json.age "$t"
          rm -f factory-out/claude-execution-output.json
          echo "Transcript kept encrypted: factory-out/transcript.json.age"

      - name: Publish branch and PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.FACTORY_MERGE_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          START: ${{ steps.branch.outputs.start }}
          TITLE: ${{ needs.preflight.outputs.story_title }}
        run: |
          echo "claude step: ${{ steps.claude.outcome }}"
          # Leftovers never block publishing. Commits exist -> push them and ignore scratch files.
          # No commits at all -> best-effort commit of leftovers (CI + AI review still gate the merge).
          git status --porcelain || true
          if [ "$(git rev-parse HEAD)" = "$START" ] && [ -n "$(git status --porcelain)" ]; then
            { git add -A && git commit -q -m "$STORY: uncommitted work left by tick #$GITHUB_RUN_NUMBER" \
                -m "Committed by the publish step; see the factory-out summary."; } || echo "::warning::could not commit leftovers"
          fi
          if [ "$(git rev-parse HEAD)" = "$START" ]; then
            echo "::error::Agent produced no commits"; echo "outcome=no-commits" >> "$GITHUB_OUTPUT"; exit 1
          fi
          # Always keep a recoverable copy of the work first
          git bundle create factory-out/work.bundle "$START..HEAD" 2>/dev/null || true
          # Main may have moved during the run (e.g. workflow edits). Merge it in so locked files match main;
          # otherwise GitHub rejects the push as a workflow change by the Actions token.
          git fetch -q "https://github.com/${GITHUB_REPOSITORY}.git" main:refs/remotes/origin/main
          if ! git merge -q --no-edit origin/main -m "Merge main into $BRANCH (factory publish)"; then
            git merge --abort || true
            echo "::error::Branch conflicts with main; work kept in factory-out/work.bundle"; exit 1
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          body=$( [ -f factory-out/summary.md ] && head -c 60000 factory-out/summary.md || echo "No summary written." )
          if [ "$MODE" != "fix" ]; then
            PR=$(gh pr create --base main --head "$BRANCH" --title "$STORY: $TITLE ($MODE)" --body "$body" --label factory | grep -o '[0-9]*$')
            # Auto-merge as the owner's PAT: GitHub ignores pushes made with GITHUB_TOKEN, so a merge by it never triggers deploy.yml.
            GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR" --auto --squash
          fi
          # nWave governance: a PR whose session didn't invoke the required nWave commands is blocked by ai-review.
          if [ "${{ steps.nwave.outputs.ok }}" != "true" ] && [ "$MODE" != "fix" ]; then
            gh pr edit "$PR" --add-label nwave-skipped
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "outcome=pushed" >> "$GITHUB_OUTPUT"

      - name: Factory log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.preflight.outputs.reason }}
          OUTCOME: ${{ steps.publish.outputs.outcome || 'failed' }}
          OUT_PR: ${{ steps.publish.outputs.pr }}
          COST: ${{ steps.cost.outputs.line }}
          NWAVE: ${{ steps.nwave.outputs.line }}
        run: |
          issue=$(gh issue list --label factory-log --state open --json number -q '.[0].number')
          [ -n "$issue" ] || issue=$(gh issue create --title "Factory log" --label factory-log --body "Append-only tick journal (written by workflows)." | grep -o '[0-9]*$')
          gh issue comment "$issue" --body "**Tick #$GITHUB_RUN_NUMBER** · $MODE · $STORY · outcome: \`$OUTCOME\` ${OUT_PR:+· PR #$OUT_PR}
          $REASON · [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          $COST
          $NWAVE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-out-${{ github.run_number }}
          path: factory-out/
          retention-days: 14
