name: weekly-demo

on:
  schedule:
    - cron: "0 16 * * 5" # Friday ~17:00 UK
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: node scripts/factory/stories.mjs > /dev/null
      - run: WEEK="$(date -u +%G-W%V)" node scripts/factory/weekly-demo.mjs
      - name: Tag the week
        run: |
          tag="demo-$(date -u +%G-W%V)"
          git tag -f "$tag" && git push -f origin "$tag"
