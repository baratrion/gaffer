# Jobs to be done. Source: docs/product/brief.md ("Job to be done").
jobs:
  - id: J-01
    name: take-charge-of-a-club
    statement: >-
      When I have a few spare minutes, I want to make meaningful managerial
      decisions and see their consequences quickly, so that I feel the
      satisfaction of building a winning team.
    dimensions:
      functional: Make club-management decisions and see their outcome within a five-minute session.
      emotional: Feel in charge and capable, never held up by setup chores.
      social: Be able to talk about "my club" and its results with other football fans.
  - id: J-02
    name: know-my-squad
    statement: >-
      When I have just taken charge of a club, I want to see who I have got,
      so that I can start judging who should play.
    dimensions:
      functional: See every player's name, position, age and overall rating at a glance on a phone.
      emotional: Feel the club is real and that I can spot my best player and my weak position.
      social: Be able to talk about "my lads" by name with other football fans.
  - id: J-03
    name: judge-a-player
    statement: >-
      When I am weighing up who should play, I want to see what each player
      is good at and how fit they are, so that I can pick a team I believe in.
    dimensions:
      functional: Open any player from the squad in one tap and read their attributes and condition, then get back to the squad.
      emotional: Feel my selection is a judgement, not a guess, because I know why one player beats another.
      social: Be able to argue for "my" pick with other football fans ("he's the best passer we have").
    forces:
      push: An overall rating alone hides why a player is good; two 14s can be very different players.
      pull: A short, familiar card of football attributes, as in the management games Sam grew up with.
      anxiety: Too many numbers on a small screen; getting lost away from the squad list.
      habit: Picking by the overall number and position code only.
    opportunity: >-
      Few attributes on one phone screen, one tap in and one tap back, sets up the
      starting-XI and match stories, where attributes start to matter.
  - id: J-04
    name: set-up-my-team
    statement: >-
      When I am getting my team ready for the next match, I want to choose how
      my side lines up, so that I can play to my squad's strengths.
    dimensions:
      functional: Pick one of a few familiar formations in one tap and see the 11 positions it needs, kept for the rest of the session.
      emotional: Feel that the shape of the team is my call, and that the game remembers it.
      social: Be able to say "we play 4-3-3" and defend the choice with other football fans.
    forces:
      push: Without a formation there is nothing to pick a team into, and no way to use a squad that is strong in one line.
      pull: The classic formation choice of the management games Sam grew up with, one tap per option.
      anxiety: Losing the choice when leaving the screen; a confusing pitch diagram on a small phone.
      habit: Thinking in a default 4-4-2 and never changing it.
    opportunity: >-
      Three formations shown as a plain line-up of position codes, one tap to change,
      gives the starting-XI story its 11 slots and the match stories a tactic to use.
  - id: J-05
    name: pick-my-starting-eleven
    statement: >-
      When I have set how my side lines up, I want to choose which players start,
      so that I field the team I believe in.
    dimensions:
      functional: See a sensible starting eleven at once, put any squad player into the slot of his position in two taps, and keep the eleven for the rest of the session.
      emotional: Feel the team on the pitch is my team, not the game's, without the chore of filling 11 slots from scratch.
      social: Be able to name "my" eleven and argue for a pick with other football fans ("I'm starting the kid up front").
    forces:
      push: A formation alone is 11 empty codes; without names in the slots there is no team to send out.
      pull: The classic "tap a slot, tap a player" team sheet of the management games Sam grew up with, pre-filled with the best eleven.
      anxiety: Losing picks when changing the formation or leaving the screen; ending up with the same player twice or a gap in the side.
      habit: Accepting the suggested eleven and only swapping one or two players.
    opportunity: >-
      An automatic best-rated eleven, one tap per swap within a position and picks that survive
      a formation change, makes "pick team" a five-minute step and gives the match stories a side to play.
  - id: J-06
    name: see-my-team-play
    statement: >-
      When I have picked my team and set how it lines up, I want to send it out and
      see the result at once, so that I find out whether my choices worked.
    dimensions:
      functional: Play the next match in one tap from the club home, starting with the first match of the season, and read the final score and who scored, on a phone, in seconds.
      emotional: Feel the result was earned by my eleven, not a dice roll, and feel the pride (or the sting) of it.
      social: Be able to tell other football fans "we won 2-1, Elderkin got the winner".
    forces:
      push: A team picked with no match to play is decisions without consequences; the five-minute loop stops at "pick team".
      pull: The instant result and scorer list of the quick-sim management games Sam grew up with, with no match to sit through.
      anxiety: A result that feels random or ignores the picks; a scorer Sam never fielded; a wait or a cluttered match screen on a phone.
      habit: Imagining how the team would do, or expecting to watch every minute of a simulated match.
    opportunity: >-
      One tap from the club home to a final score and a goal list drawn from Sam's own eleven, seeded and
      repeatable, gives the loop its "play match" step and sets up commentary, stats, the season and the table.
  - id: J-07
    name: see-where-we-stand
    statement: >-
      When I have seen my team's result, I want to see where my club stands in the
      league, so that I know whether my season is on track and what the next match means.
    dimensions:
      functional: Open the league table in one tap from the club home, before or after a match, and read every club's position, games, wins, draws, losses, goal difference and points on a phone, one tap from the club home.
      emotional: Feel that each result counts for something, and feel the pull of the climb (or the worry of the drop).
      social: Be able to tell other football fans "we're third after one game, level on points with the top".
    forces:
      push: A result with no table is a one-off; Sam cannot tell whether a 1-2 defeat matters or how far off the top he is.
      pull: The classic league table of the management games Sam grew up with, read at a glance, his own club picked out.
      anxiety: A table that does not match the score he just saw, or that shifts when he changes his team afterwards; too many columns to fit a phone.
      habit: Working out the standings in his head from his own result and ignoring the other matches.
    opportunity: >-
      One tap from the club home to a compact table built from the matchday's recorded results, his row
      highlighted and kept for the session, closes the five-minute loop (pick team, play match, see table)
      and sets up the later matchdays, the other results and the end-of-season position.
  - id: J-08
    name: play-out-my-season
    statement: >-
      When I come back for a few spare minutes, I want to play my club's next match of the
      season, so that each result builds toward where we finish.
    dimensions:
      functional: Play the next matchday in one tap from the club home, meet every rival home and away over 14 matchdays, and read the table after every match, on a phone.
      emotional: Feel the season move, with each result and each change to my eleven counting for what comes next, and feel the closure of a final position.
      social: Be able to tell other football fans "we finished third, five points off the title, and beat Marlbrook away".
    forces:
      push: A season stuck on matchday 1 has no next decision; one result and a table that never moves are not a season.
      pull: The classic "play the next fixture, check the table" rhythm of the management games Sam grew up with, one match per tap.
      anxiety: Results that change after the fact, picks that do not count for the next match, a season that never ends or ends without saying so.
      habit: Re-reading the last result and table instead of playing on; expecting to set up every match from scratch.
    opportunity: >-
      One tap per matchday from the club home, each result recorded for good and the table updated every
      time, carries the five-minute loop through a whole season and sets up the end-of-season screen,
      save and continue, and the other results.
  - id: J-09
    name: see-how-my-season-ended
    statement: >-
      When my club's last match of the season is played, I want to see where we finished and who
      scored our goals, and to start again at once, so that the season feels complete and I can try
      to do better.
    dimensions:
      functional: See the club's final league position and its top scorer in one tap after the last matchday, on a phone, and start a fresh season of the same league in one more tap.
      emotional: Feel the closure of a season with a verdict, the pride (or the sting) of where we finished, and the pull of another go.
      social: Be able to tell other football fans "we finished third, and Thistlewood got five".
    forces:
      push: A season that ends with a bare "Season over" has no verdict; finding the position needs a table scan, the scorers are lost on match screens that cannot be re-opened, and another season needs a page reload.
      pull: The end-of-season summary of the management games Sam grew up with, a final place and a star player at a glance, then "new game".
      anxiety: A final position that disagrees with the table, a top scorer that is not the one he remembers, a tie decided at random; losing the season he just finished by tapping the wrong button.
      habit: Reading the final table and closing the tab; reloading the page to start over.
    opportunity: >-
      One tap from the club home to a derived verdict (final position and top scorer from the recorded
      results) and one tap to a fresh season closes the "start to finish" loop of the north star and sets
      up save and continue, a next season and season records.
  - id: J-10
    name: carry-on-my-season
    statement: >-
      When I come back to the game after a break, I want to pick up my season where I left it, so that
      my club and my results carry on across short sessions.
    dimensions:
      functional: After a reload or a closed tab, get back to my club, with its formation, Starting XI, results and next matchday unchanged, in one tap from the title screen on a phone.
      emotional: Feel safe closing the game at any moment, and feel that my season and my decisions are kept, not wiped.
      social: Be able to tell other football fans "I'm on matchday 9 with Netherwold, third and climbing", over days, not one sitting.
    forces:
      push: A 14-matchday season does not fit a 5-minute session, and a reload or a dropped tab loses every result and pick; replaying to where he was needs every choice from memory.
      pull: The "Continue" of the management games Sam grew up with, which puts him straight back at his club, with no save chore.
      anxiety: A continue that silently changes his team or his results; a broken save that blocks the game; tapping "New game" by mistake and losing the season.
      habit: Playing only when there is time for a whole season, or keeping the tab open and hoping the browser does not drop it.
    opportunity: >-
      An automatic save after every tap that changes the game, and one "Continue" on the title that
      restores the club, its team sheet and its results exactly, lets a season be played across many
      five-minute sessions and sets up a next season, the inbox and season records.
  - id: J-11
    name: follow-my-seasons-story
    statement: >-
      When I come back between matches, I want to look back over how my season has gone, so that I
      can see whether my decisions are paying off.
    dimensions:
      functional: From the club home, in one tap on a phone, re-read every played matchday's result and where my club stood in the league right after it, newest first.
      emotional: Feel oriented after a break, the pride of a climb (or the honesty of a slide), and that what was played is kept, never rewritten.
      social: Be able to tell other football fans the story of the season ("bottom after two, second after nine, and we finished third").
    forces:
      push: A played match can never be re-opened and the table shows only today, so after a break Sam cannot recall how the last games went or whether his club is climbing or slipping.
      pull: The inbox of match reports in the management games Sam grew up with, read at a glance between fixtures.
      anxiety: Reports that disagree with the score he saw or the table he read; a cluttered feed on a small screen; reports that change when he changes his team.
      habit: Remembering results in his head, or checking only the current table and guessing the trend.
    opportunity: >-
      One read-only report per played matchday, derived from the recorded results (score line and league
      position after it), needs no new stored data and sets up storylines, player form and the other
      results in the same feed.
