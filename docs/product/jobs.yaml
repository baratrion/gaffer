# Jobs to be done. Source: docs/product/brief.md ("Job to be done").
jobs:
  - id: J-01
    name: take-charge-of-a-club
    statement: >-
      When I have a few spare minutes, I want to make meaningful managerial
      decisions and see their consequences quickly, so that I feel the
      satisfaction of building a winning team.
    dimensions:
      functional: Make club-management decisions and see their outcome within a five-minute session.
      emotional: Feel in charge and capable, never held up by setup chores.
      social: Be able to talk about "my club" and its results with other football fans.
  - id: J-02
    name: know-my-squad
    statement: >-
      When I have just taken charge of a club, I want to see who I have got,
      so that I can start judging who should play.
    dimensions:
      functional: See every player's name, position, age and overall rating at a glance on a phone.
      emotional: Feel the club is real and that I can spot my best player and my weak position.
      social: Be able to talk about "my lads" by name with other football fans.
  - id: J-03
    name: judge-a-player
    statement: >-
      When I am weighing up who should play, I want to see what each player
      is good at and how fit they are, so that I can pick a team I believe in.
    dimensions:
      functional: Open any player from the squad in one tap and read their attributes and condition, then get back to the squad.
      emotional: Feel my selection is a judgement, not a guess, because I know why one player beats another.
      social: Be able to argue for "my" pick with other football fans ("he's the best passer we have").
    forces:
      push: An overall rating alone hides why a player is good; two 14s can be very different players.
      pull: A short, familiar card of football attributes, as in the management games Sam grew up with.
      anxiety: Too many numbers on a small screen; getting lost away from the squad list.
      habit: Picking by the overall number and position code only.
    opportunity: >-
      Few attributes on one phone screen, one tap in and one tap back, sets up the
      starting-XI and match stories, where attributes start to matter.
  - id: J-04
    name: set-up-my-team
    statement: >-
      When I am getting my team ready for the next match, I want to choose how
      my side lines up, so that I can play to my squad's strengths.
    dimensions:
      functional: Pick one of a few familiar formations in one tap and see the 11 positions it needs, kept for the rest of the session.
      emotional: Feel that the shape of the team is my call, and that the game remembers it.
      social: Be able to say "we play 4-3-3" and defend the choice with other football fans.
    forces:
      push: Without a formation there is nothing to pick a team into, and no way to use a squad that is strong in one line.
      pull: The classic formation choice of the management games Sam grew up with, one tap per option.
      anxiety: Losing the choice when leaving the screen; a confusing pitch diagram on a small phone.
      habit: Thinking in a default 4-4-2 and never changing it.
    opportunity: >-
      Three formations shown as a plain line-up of position codes, one tap to change,
      gives the starting-XI story its 11 slots and the match stories a tactic to use.
  - id: J-05
    name: pick-my-starting-eleven
    statement: >-
      When I have set how my side lines up, I want to choose which players start,
      so that I field the team I believe in.
    dimensions:
      functional: See a sensible starting eleven at once, put any squad player into the slot of his position in two taps, and keep the eleven for the rest of the session.
      emotional: Feel the team on the pitch is my team, not the game's, without the chore of filling 11 slots from scratch.
      social: Be able to name "my" eleven and argue for a pick with other football fans ("I'm starting the kid up front").
    forces:
      push: A formation alone is 11 empty codes; without names in the slots there is no team to send out.
      pull: The classic "tap a slot, tap a player" team sheet of the management games Sam grew up with, pre-filled with the best eleven.
      anxiety: Losing picks when changing the formation or leaving the screen; ending up with the same player twice or a gap in the side.
      habit: Accepting the suggested eleven and only swapping one or two players.
    opportunity: >-
      An automatic best-rated eleven, one tap per swap within a position and picks that survive
      a formation change, makes "pick team" a five-minute step and gives the match stories a side to play.
  - id: J-06
    name: see-my-team-play
    statement: >-
      When I have picked my team and set how it lines up, I want to send it out and
      see the result at once, so that I find out whether my choices worked.
    dimensions:
      functional: Play the next match in one tap from the club home, starting with the first match of the season, and read the final score and who scored, on a phone, in seconds.
      emotional: Feel the result was earned by my eleven, not a dice roll, and feel the pride (or the sting) of it.
      social: Be able to tell other football fans "we won 2-1, Elderkin got the winner".
    forces:
      push: A team picked with no match to play is decisions without consequences; the five-minute loop stops at "pick team".
      pull: The instant result and scorer list of the quick-sim management games Sam grew up with, with no match to sit through.
      anxiety: A result that feels random or ignores the picks; a scorer Sam never fielded; a wait or a cluttered match screen on a phone.
      habit: Imagining how the team would do, or expecting to watch every minute of a simulated match.
    opportunity: >-
      One tap from the club home to a final score and a goal list drawn from Sam's own eleven, seeded and
      repeatable, gives the loop its "play match" step and sets up commentary, stats, the season and the table.
  - id: J-07
    name: see-where-we-stand
    statement: >-
      When I have seen my team's result, I want to see where my club stands in the
      league, so that I know whether my season is on track and what the next match means.
    dimensions:
      functional: Open the league table in one tap from the club home, before or after a match, and read every club's position, games, wins, draws, losses, goal difference and points on a phone, in seconds.
      emotional: Feel that each result counts for something, and feel the pull of the climb (or the worry of the drop).
      social: Be able to tell other football fans "we're third after one game, level on points with the top".
    forces:
      push: A result with no table is a one-off; Sam cannot tell whether a 1-2 defeat matters or how far off the top he is.
      pull: The classic league table of the management games Sam grew up with, read at a glance, his own club picked out.
      anxiety: A table that does not match the score he just saw, or that shifts when he changes his team afterwards; too many columns to fit a phone.
      habit: Working out the standings in his head from his own result and ignoring the other matches.
    opportunity: >-
      One tap from the club home to a compact table built from the matchday's recorded results, his row
      highlighted and kept for the session, closes the five-minute loop (pick team, play match, see table)
      and sets up the later matchdays, the other results and the end-of-season position.
