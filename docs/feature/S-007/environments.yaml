# S-007 DEVOPS environments. Static site, GitHub Pages, base path /gaffer/. Inherits S-006 (and S-001..S-005); no platform change.
base_path: /gaffer/
client:
  browser: chromium
  device: Pixel 7        # Playwright devices["Pixel 7"]
  viewport_width_px: 390
platform_notes:
  - "Every S-007 navigation (club home to table, Back to club home) is a screen change, so focus goes to the new h1 (ADR-0008); no platform-specific focus path."
  - "Cross-engine float determinism (ADR-0012 Earned Trust 1): playMatchday calls playMatch for 4 fixtures (streams 200..203); match.ts uses only + - * /, comparisons and Math.floor. The e2e compares the browser's seed-31 table after matchday 1 with the golden the Node unit test pins. Probed in Chromium only (local-preview and production)."
  - "Native table roles (ADR-0013 Earned Trust 2): 9 rows, 8 columnheaders, 8 rowheaders, 56 cells counted in Chromium; a display override on any table part drops the roles."
  - "390px fit, GD text (ASCII U+002D), innerText equals textContent, and exactly one aria-current row are probed in Chromium only."
target_environments:
  local-dev:
    url: http://localhost:5173/gaffer/
    command: pnpm dev
  local-preview:
    url: http://localhost:4173/gaffer/
    command: pnpm run ci:serve
    used_by: [ci:e2e, protected-scenarios]
  production:
    url: https://<repository_owner>.github.io/gaffer/
    deploy: .github/workflows/deploy.yml   # on push to main, strategy recreate
    smoke: "BASE_URL=<production url> pnpm run ci:e2e"
deployment_strategy: recreate
container_orchestration: none
observability: browser console + Playwright smoke on deployed URL
mutation_testing: nightly-delta   # stryker mutates src/domain/** except names.ts (covers standings.ts and match.ts) plus src/app/state.ts (covers results, ViewTable, recording in PlayMatch, NewGame reset, Back, sameScreen table case, standingsOf, matchFor); no stryker.config.mjs change needed
branching: trunk-based, short-lived claude/* branches, squash merge
deployment_assumptions:
  artifact: static (dist/index.html under /gaffer/)
  strategy: recreate
  persistence: none         # GameState.results lives in memory for the page's life; a reload shows the title screen
  data_migration: none      # no storage, no save version; results is an absent-key optional field
  deploy_idempotent: true   # redeploying a ref yields the same artifact
  result_stability: "every result for every seed is frozen by ADR-0011 (constants, draw order, streams 200..255; matchday 1 uses 200..203); the table is a pure function of the results; a later change needs an ADR amendment"
kpi_instrument:
  - kpi: K1 standing read in 1 tap from the club home ("Table"), 2 taps from the match screen ("Back", "Table"); all 8 rows shown on arrival; back home in 1 tap ("Back")
    spec: tests/e2e/S-007-table.spec.ts
    runs_on: [local-preview, production]
  - kpi: K2 100% of rows satisfy W + D + L = P and Pts = 3W + D; Sam's row matches his score line and the opponent's mirrors it; 0 mismatches over seeds 1..1000 x 8 managed clubs
    spec: tests/acceptance/S-007/standings.test.ts and table-navigation.test.ts (fast-check, FC_SEED) and tests/e2e/S-007-table.spec.ts (seed-31 golden table)
    runs_on: [ci:test, local-preview, production]
  - kpi: K3 0 changes to the table or the re-shown match over any run of up to 40 formation, pick and navigation taps after playing
    spec: tests/acceptance/S-007/table-navigation.test.ts (40-action property) and tests/e2e/S-007-table.spec.ts (formation change walk)
    runs_on: [ci:test, local-preview, production]
coexistence_matrix:
  - component: tests/protected/S-001/ .. tests/protected/S-006/
    impact: club home gains a fifth button "Table" (no name collision with "Squad", "Tactics", "Starting XI", "Play match", "Back"; "Table" does not contain "Players"); they do not count club home buttons
    action: must stay green
  - component: tests/protected/S-007/
    impact: this story's locked scenario (written in the plan run)
    action: must pass on main
  - component: tests/acceptance/S-001/ .. tests/acceptance/S-006/
    impact: none beyond the D12 amendments; never-played states have no results key, S-006 goldens unchanged
    action: reuse; amend per D12 (replace, never weaken)
  - component: tests/e2e/S-005-starting-xi.spec.ts, tests/e2e/S-006-match.spec.ts
    impact: exact club-home button lists gain "Table" (D12)
    action: amend in the same commit as the production change
  - component: tests/e2e/S-001..S-006 specs, shell.spec.ts
    impact: focus on h1 after navigation still holds (ADR-0008); club-home regression specs check the new 48px button
    action: reuse unchanged, regression-watch
  - component: tests/e2e/S-007-table.spec.ts, tests/acceptance/S-007/
    impact: new specs
    action: add (DISTILL)
  - component: .github/workflows/*, ci:* scripts, playwright.config.ts
    impact: none
    action: reuse
  - component: stryker.config.mjs
    impact: none; standings.ts and match.ts match src/domain/**/*.ts, the state.ts changes are in src/app/state.ts, all already in the mutate list
    action: none
rollback: revert the S-007 squash commit on main (deploy fires on merge), or workflow_dispatch of deploy.yml on a known-good ref (pre-S-007 commit); fallback fix-forward
rollback_owner: owner
