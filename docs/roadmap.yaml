# nWave-owned story queue, written by the factory's plan runs (AI-reviewed, auto-merged).
# Delivered strictly in order. A story is DONE only when tests/protected/<id>/ scenarios pass on main.
# Protected scenarios are append-only: once merged they can never be edited or deleted.
# Out-of-scope tags are forbidden; the list lives in factory/config.json (owner-only).
#
# Story shape:
#   - id: S-001          # S-NNN, never reused
#     week: 0            # target demo week
#     title: ...
#     tags: [...]
#     outcome: >         # what the player can do afterwards, observable on a phone
#       ...

stories:
  - id: S-001
    week: 0
    title: Start a new game and pick a club
    tags: [onboarding, league]
    outcome: >
      From the title screen the player taps "New game" and sees a screen with a heading and a list
      named "Clubs" holding the 8 clubs of a generated fictional league. Each club appears as one
      tappable button (44px or taller) whose first line of text is the club's unique name, with the
      club's two colours shown as a decorative swatch (hidden from screen readers; not
      black-box tested). Tapping a club lands on that club's home screen, whose
      heading shows the club's name. The league comes from a seed: opening the game with the same
      "?seed=" in the address always generates the same league, different seeds generate different
      leagues, and without a valid seed the game uses a fixed default seed. Each screen has exactly one
      top-level heading. No horizontal scroll at 390px.

  - id: S-002
    week: 1
    title: View my squad
    tags: [squad]
    outcome: >
      From the club home screen the player taps "Squad" and sees a list named "Squad" with the club's
      18 generated players. Each row shows, in this order, the player's name, position (GK, DF, MF or
      FW), age (16-40) and overall rating (1-20); age and overall are the first two numbers in the
      row. Every club's squad has at least 2 goalkeepers and players in every position, and every
      club has different players. A button named exactly "Back" returns to the club home screen. The squad comes from the same seed as the league, so it is identical on every
      visit with the same seed. No horizontal scroll at 390px.

  - id: S-003
    week: 1
    title: View a player's details
    tags: [squad]
    outcome: >
      In the list named "Squad" each of the 18 player rows holds exactly one tappable button (44px or
      taller) whose text still reads name, position, age, overall (age and overall the first two
      numbers). Tapping a row, whatever its position (GK, DF, MF or FW), opens that player's screen:
      exactly one heading, the player's name, and the lines "Position" (GK, DF, MF or FW), "Age" and
      "Overall", each read as one line of text (label, one space, value, for example "Position GK",
      "Age 27", "Overall 14") with the same values as the tapped row. A list named "Attributes" holds
      exactly 4 items, "Goalkeeping", "Defending", "Passing" and "Shooting" in that order, each read as
      the attribute name, one space and a whole number from 1 to 20 (for example "Goalkeeping 15"),
      with no other number. The overall is at least the player's lowest and at most their highest
      attribute. Outside that list a line reads "Condition" followed by a whole percentage from 0 to
      100 (for example "Condition 92%"). A button named exactly "Back" (44px or taller) returns to the
      same club's squad list (heading the club's name, 18 players); "Back" there still returns to the
      club home. After each tap, focus moves to the new screen's heading. The player screen comes from the same seed as the league, so it is identical on every
      visit with the same seed, also when the seed is invalid and the default is used, and the players
      of a squad do not all share the same attributes. No horizontal scroll at 390px and no console
      errors.

  - id: S-004
    week: 2
    title: Choose a formation
    tags: [tactics]
    outcome: >
      From the club home screen the player taps a button named exactly "Tactics" (44px or taller) and
      sees a screen whose only heading is "Tactics", with focus on that heading. A radio group named
      "Formation" holds exactly three radio buttons named "4-4-2", "4-3-3" and "4-2-3-1", in that order;
      each radio's visible label is its formation name and is 44px or taller, and tapping the label
      checks that radio. Exactly one is checked, and in a new game (from "New game" on the title screen)
      it is "4-4-2". A list named "Line-up" holds exactly 11 items, each reading exactly one position code
      (GK, DF, MF or FW), goalkeeper first, then defenders, midfielders and forwards: 4-4-2 is 1 GK, 4 DF,
      4 MF, 2 FW; 4-3-3 is 1 GK, 4 DF, 3 MF, 3 FW; 4-2-3-1 is 1 GK, 4 DF, 5 MF, 1 FW. Tapping a formation
      checks it, unchecks the others and updates the list at once, while the heading stays "Tactics" and
      focus is on the tapped formation's radio button. A button named exactly "Back" (44px or taller)
      returns to the club home (heading the club's name). The choice is kept for the rest of the session:
      tapping "Tactics" again, also after visiting "Squad", shows the same formation checked with its
      line-up. The line-ups do not depend on the seed (the same for "?seed=31" and "?seed=abc"). No
      horizontal scroll at 390px and no console errors.

  - id: S-005
    week: 3
    title: Pick my starting XI
    tags: [tactics, squad]
    outcome: >
      From the club home screen the player taps a button named exactly "Starting XI" (44px or taller,
      stacked after "Squad" and "Tactics") and sees a screen whose only heading is "Starting XI", with
      focus on that heading. A list named "Starting XI" holds exactly 11 items, each holding exactly one
      button (44px or taller) whose text reads the slot's position code (GK, DF, MF or FW), one space,
      the player's name, one space, and the player's overall (1-20) as the only number, for example
      "MF Ivo Elderkin 18" (the name is everything between the code and the final number; names may
      hold an apostrophe or a hyphen, as in "DF Ulric O'Garrity 8"). The 11 position codes are the
      chosen formation's line-up, in the same order as the Tactics "Line-up" list: 4-4-2 is 1 GK, 4 DF,
      4 MF, 2 FW; 4-3-3 is 1 GK, 4 DF, 3 MF, 3 FW; 4-2-3-1 is 1 GK, 4 DF, 5 MF, 1 FW. Each of the 11 is a
      different player of the club's squad whose squad position equals the slot's code, with the same
      name and overall as in the "Squad" list. In a new game the XI is picked automatically: in each
      position the players with the highest overall start (no squad player of a position who is not in
      the XI has a higher overall than a starter of that position), and the starters of a position are
      listed from highest to lowest overall, ties in squad order. The automatic XI comes from the seed:
      the same "?seed=" always gives the same XI. Tapping a slot opens a screen whose only heading is
      "Choose GK", "Choose DF", "Choose MF" or "Choose FW" (the slot's code), with focus on that heading,
      and a list named "Players" holding one button (44px or taller) per squad player of that position
      (2 GK, 6 DF, 6 MF or 4 FW) in squad order, each reading the player's name, one space and the
      overall, followed by one space and "Starting" for each player currently in the XI (for example
      "Ivo Elderkin 18 Starting"), so exactly as many read "Starting" as the formation has slots of that
      position. Tapping a player returns to the Starting XI screen (heading focused) with that player in
      the tapped slot. If the player was already in another slot, the tapped slot's previous player moves
      to that other slot (a swap); tapping the slot's own player changes nothing. The XI always holds 11
      different players. A button named exactly "Back" (44px or taller) on the choose screen returns to
      the Starting XI screen (heading focused) unchanged; a button named exactly "Back" (44px or taller)
      on the Starting XI screen returns to the club home, with focus on its heading, the club's name.
      The XI is kept for the rest of the session: after visiting "Squad", or "Tactics" without choosing
      another formation, and coming back, it is unchanged. An XI the player never changed always follows
      the formation: after choosing another formation in Tactics, Starting XI shows the automatic XI of
      the new formation. In this story any formation change re-picks the automatic XI of the new
      formation (a later story may keep the player's picks). "New game" starts from the automatic XI
      again. No horizontal scroll at 390px and no console errors.

  - id: S-006
    week: 4
    title: Play my first match
    tags: [match, league]
    outcome: >
      From the club home screen the player taps a button named exactly "Play match" (44px or taller;
      the club home's heading is still the club's name and its "Squad", "Tactics" and "Starting XI"
      buttons stay) and sees the match screen of the club's matchday-1 league fixture, already
      played (quick-sim, no pitch): its only top-level heading (h1) is "Matchday 1", focused on
      arrival. On arrival, the score line and the Goals list are already visible when the heading
      has focus (the result is not revealed over time); any later commentary is additive and never
      delays them. The score line is exactly one piece of text on the match screen whose whole text
      reads the home club's name, one space, the home goals, an en dash (–), the away goals, one
      space and the away club's name, with no spaces around the dash (pattern ^(.+) (\d)–(\d)
      (.+)$), for example "Netherwold Borough 2–1 Brindlecombe Rovers"; no other text on the match
      screen (commentary or stats included) reads in that format. Goals are whole numbers from 0 to
      9. One of the two clubs is the player's club and the other is a different club from the
      "Clubs" list of the same league. On matchday 1 every club of the league plays exactly one
      other club, and the pairing and which club is named first come from the league's fixed
      schedule: in a new game with the same seed, picking the opponent instead shows the same two
      clubs in the same order. A list named "Goals" holds exactly one item per goal (home goals plus
      away goals; for 0–0 the list is there with no items), in match order with minutes never
      decreasing. Each item reads exactly the minute (a whole number from 1 to 90), a straight
      apostrophe ('), one space, the scorer's name, one space and the scorer's club name in round
      brackets, for example "23' Ivo Elderkin (Netherwold Borough)"; names may hold an apostrophe or
      a hyphen, as in "61' Ulric O'Garrity (Oakhampton Rise Borough)". The number of items naming
      each club equals that club's goals in the score line. Every goal for the player's club is
      scored by one of the 11 players on its Starting XI screen at the time of the match, never the
      one in the GK slot; every goal for the opponent is scored by a player of the opponent's
      "Squad" list who is not a goalkeeper (GK), never by a player of the player's squad. The match
      comes from the seed: two fresh visits with the same "?seed=" and the same club, without
      changing the formation or the Starting XI, show the identical match screen, and "?seed=abc"
      shows the same match as no seed. Over the 8 clubs of a league, not every matchday-1 match ends
      0–0. A button named exactly "Back" (44px or taller) returns to the club home with focus on its
      heading, the club's name, and the formation in Tactics and the Starting XI are unchanged.
      These hold for the first match of a new game in every later version of the game: the h1
      "Matchday 1", the one score line in this format, the "Goals" list in this format, both shown
      on arrival, and "Back" to the club home. No horizontal scroll at 390px and no console errors.

  - id: S-007
    week: 5
    title: See the league table after my first match
    tags: [league, match]
    outcome: >
      From the club home screen the player taps a button named exactly "Table" (44px or taller; the club
      home's heading is still the club's name and its "Squad", "Tactics", "Starting XI" and "Play match"
      buttons stay) and sees the league table screen: its screen title, the only top-level heading (h1),
      is "League table", focused on arrival. A table (role table) named "League table" has exactly one
      header row and exactly 8 body rows, one per club of the "Clubs" list, each club exactly once. In
      this version the table has exactly 8 columns, whose column headers read exactly, in this order,
      "Pos", "Club", "P", "W", "D", "L", "GD" and "Pts", and each body row has, in this order, Pos (a
      cell), Club (the row header, role rowheader) and then P, W, D, L, GD and Pts (cells): in this
      version 7 cells and 1 row header. Pos is the row's position, 1 to 8 down the table, with no shared
      positions; Club is the club's name; P (played), W (won), D (drawn), L (lost) and Pts (points) are
      whole numbers; GD (goal difference) reads "+N" when positive, "0" when zero and "-N" with an ASCII
      hyphen-minus when negative, for example "+4", "0" and "-1". On every row, before and after the first
      match, W + D + L = P and Pts = 3 × W + D. Pts never increases down the table and, between rows with
      equal Pts, GD never increases. In this version the full order is Pts from high to low, then GD from
      high to low, then goals scored from high to low, then club name from A to Z in code-point order (a
      space sorts before any letter; club names are letters and spaces only); goals scored is not shown,
      so the goals-scored and club-name tie-breaks are checked only by unit and acceptance tests. The
      player's club's row is highlighted (visual only; not black-box tested). In a new game (after loading
      the page and tapping "New game" on the title screen), before the player has played a match, every
      row reads P 0, W 0, D 0, L 0, GD 0 and Pts 0, and the rows are in A to Z order of club name. The
      first "Play match" of a new game plays matchday 1 for the whole league: the player's fixture exactly
      as before, and the league's 3 other matchday-1 fixtures are simulated, and the 4 results are
      recorded at that moment; from then on the match screen and the table read only those recorded
      results. After "Play match", "Back" and "Table", every row has P 1, the total of W equals the total
      of L, the total of D is even and the GDs add up to 0; the player's club's row agrees with the score
      line of its match screen (a win reads W 1 and Pts 3, a draw D 1 and Pts 1, a loss L 1 and Pts 0, and
      GD is the club's goals minus the other club's goals) and the other club of that score line has the
      mirror row (W and L swapped, the same D, GD negated). Recorded results are kept until the page is
      reloaded: changing the formation in Tactics or the Starting XI afterwards does not change the table,
      and visiting "Squad", "Tactics" or "Starting XI" and coming back leaves it unchanged. In this
      version a second "Play match" re-shows the same recorded matchday-1 match (the same score line and
      "Goals" list), whatever formation or Starting XI was chosen in between; later versions may move on
      to the next matchday instead. The table comes from the seed: two fresh visits with the same "?seed="
      and the same club, without changing the formation or the Starting XI, show the identical table after
      matchday 1, and "?seed=abc" shows the same table as no "?seed=" in the address. A button named
      exactly "Back" (44px or taller) returns to the club home with focus on its heading, the club's name,
      and the formation in Tactics and the Starting XI are unchanged. The first match of a new game still
      reads "Matchday 1" as before. These hold in every later version of the game: the "Table" button on
      the club home; the screen title "League table"; the table named "League table" with one body row per
      club, whose first 8 column headers read "Pos", "Club", "P", "W", "D", "L", "GD" and "Pts" in this
      order, with these cell formats and Club as the row header (later versions may add columns only after
      "Pts"); the row rules W + D + L = P and Pts = 3 × W + D on every row; Pts never increasing down the
      table and GD never increasing between rows with equal Pts; the all-zero table, in A to Z order, of a
      new game before its first match; and "Back" to the club home. The goals-scored and club-name
      tie-breaks and the re-show on a second "Play match" are rules of this version only. No horizontal
      scroll at 390px and no console errors.

  - id: S-008
    week: 6
    title: Play the season, matchday by matchday
    tags: [season, match, league]
    outcome: >
      From the club home screen, each tap on the button named exactly "Play match" (44px or taller)
      plays the next matchday of the season for the whole league and shows the match screen of the
      player's club's fixture on that matchday. The first tap of a new game plays matchday 1 exactly
      as before, the second plays matchday 2, and so on up to matchday 14. On each matchday the
      player's fixture is played with the formation in Tactics and the Starting XI at the moment of
      the tap, and the league's 3 other fixtures are simulated; the 4 results are recorded at that
      moment and never change afterwards. The match screen's only top-level heading (h1) reads
      "Matchday N", where N is the matchday just played (a whole number from 1 to 14), focused on
      arrival, and the score line and the list named "Goals" are already visible. The score line is
      exactly one piece of text whose whole text reads the home club's name, one space, the home
      goals, an en dash (–), the away goals, one space and the away club's name (pattern ^(.+)
      (\d)–(\d) (.+)$), for example "Rushmoor Heath Albion 2–1 Netherwold Borough"; one of the two
      clubs is the player's club and the other is a different club of the "Clubs" list. The "Goals"
      list holds exactly one item per goal, in match order with minutes never decreasing, each
      reading exactly the minute (1 to 90), a straight apostrophe ('), one space, the scorer's name,
      one space and the scorer's club name in round brackets, for example "23' Ivo Elderkin
      (Netherwold Borough)"; the number of items naming each club equals that club's goals in the
      score line. Every goal for the player's club is scored by one of the 11 players on its
      Starting XI screen at the time of that match, never the one in the GK slot; every goal for the
      other club is scored by a player of that club's "Squad" list who is not a goalkeeper (GK). A
      button named exactly "Back" (44px or taller) returns to the club home with focus on its
      heading, the club's name. Opponents come from the league's fixed double round-robin schedule,
      the same for every seed (the club names vary with the seed): over matchdays 1 to 7 the
      player's club meets each of the other 7 clubs exactly once, over matchdays 8 to 14 again
      exactly once each, and over the 14 matchdays it is named first in the score line against each
      other club exactly once and named second exactly once. Changing the formation or the Starting
      XI between two matches changes nothing already played, and the table stays as it was; the
      change counts from the next "Play match" on. After the player's N-th match, "Back" and "Table"
      show the table named "League table" with every row at P N; on every row W + D + L = P and Pts
      = 3 × W + D; the total of W equals the total of L, the total of D is even and the GDs add up
      to 0; the player's club's row equals the sum of the score lines of its N matches (W, D and L
      count its wins, draws and losses, GD is its goals minus the goals against, written as in the
      table, for example "+2", "0" or "-2", and Pts is 3 per win plus 1 per draw); Pts never
      increases down the table and, between rows with equal Pts, GD never increases. The season
      comes from the seed: two fresh visits with the same "?seed=", the same club and the same
      choices show the same match screens and the same table after every matchday, and "?seed=abc"
      plays the same season as no "?seed=" in the address. Results are kept until the page is
      reloaded. In this version, after matchday 14 has been played, the club home shows no "Play
      match" button and shows a line reading exactly "Season over" instead (its heading and its
      "Squad", "Tactics", "Starting XI" and "Table" buttons stay), and "Table" still shows every row
      at P 14; an already played match cannot be re-opened. This version amends the S-007 outcome's
      "Play match" button staying on the club home, from matchday 14 on only; S-007's durable list
      is unchanged and no protected scenario reaches matchday 14. These hold in every later version
      of the game, within each season (a new game, and any later season a later version may start):
      each "Play match" plays the season's next matchday in order; the match screen of the season's
      N-th match has the h1 "Matchday N" (1 to 14) with the score line and the "Goals" list in these
      formats; after the season's N-th match every table row has P N; and over the season's 14
      matchdays the player's club meets every other club exactly twice, named first once and named
      second once. The "Season over" line and the missing "Play match" button after matchday 14 are
      rules of this version only. No horizontal scroll at 390px and no console errors.

  - id: S-009
    week: 7
    title: See how my season ended
    tags: [season, league]
    outcome: >
      Once all 14 matchdays of the season have been played, the club home shows, in the place where
      "Play match" was, a button named exactly "End of season" (44px or taller); the line "Season
      over" of S-008 is no longer shown, and the club home's heading (the club's name) and its
      "Squad", "Tactics", "Starting XI" and "Table" buttons stay. Before matchday 14 has been played
      there is no "End of season" button and "Play match" is there as before. Tapping "End of season"
      opens a screen whose only top-level heading (h1) reads exactly "End of season", focused on
      arrival. It shows these lines, each read as one line of text (label, one space, value): "Final
      position" followed by the ordinal of the club's Pos in the League table after matchday 14, one
      of "1st", "2nd", "3rd", "4th", "5th", "6th", "7th" or "8th" (pattern ^Final position
      (1st|2nd|3rd|4th|5th|6th|7th|8th)$, for example "Final position 3rd"), equal to that club's Pos
      on the "Table" screen; and "Top scorer" followed either by exactly "none", when the club scored
      no goal all season, or by the name of the club's player with the most goals for the club over
      its 14 league matches, one space and the count in round brackets, "(N goals)", or "(1 goal)"
      when the count is 1 (one pattern for the whole line: ^Top scorer (none|(.+) \((\d+) goals?\))$,
      with "goal" singular exactly when the count is 1; for example "Top scorer Garrick Thistlewood (5
      goals)", "Top scorer Orrin Yarrow (1 goal)" or "Top scorer none"). The count equals the number
      of items naming that player and the club on the club's 14 match screens' "Goals" lists, and no
      player of the club has more; when players are tied, the one listed first in the club's "Squad"
      list is named. Player names are unique within a league and hold no round brackets. Below them
      are a button named exactly "Play again" and a button named exactly "Back", both 44px or taller.
      "Back" returns to the club home with focus on its heading, the club's name, still showing "End
      of season" and no "Play match"; "Table" still shows every row at P 14, and "End of season"
      opens the same screen again; an already played match cannot be re-opened. "Play again" starts a
      new game at once with the same seed and shows the screen that "New game" on the title screen
      shows, with focus on that screen's only top-level heading (h1), whose text is not checked, and
      the list named "Clubs" holding the same 8 clubs in the same order; nothing of the old season
      remains: after picking a club the table reads P 0, W 0, D 0, L 0, GD 0 and Pts 0 on every row in
      A to Z order, Tactics has "4-4-2" checked, the Starting XI is the automatic one, and the next
      "Play match" plays "Matchday 1". Everything on the End of season screen comes from the season's
      recorded results and the seed, and nothing new is stored: two fresh visits with the same
      "?seed=", the same club and the same choices show the same End of season screen, "?seed=abc"
      shows the same screen as no "?seed=" in the address, and after "Play again" the same club and
      the same choices play the same season again. Changing Tactics or the Starting XI after matchday
      14 does not change the End of season screen. Results are kept until the page is reloaded. These
      hold in every later version of the game, within each season: once the season's 14 matchdays are
      played the club home offers "End of season", and does not before; its screen has the only h1
      "End of season", the "Final position" line equal to the club's Pos in the table, the "Top
      scorer" line in this format and by this rule, and "Back" to the club home. Where "Play again"
      lands is a rule of this version only. This version replaces S-008's "Season over" line, which
      S-008 marked as a rule of its version only; S-008's durable list is unchanged. No horizontal
      scroll at 390px and no console errors.

  - id: S-010
    week: 8
    title: Save and continue my season
    tags: [save, season]
    outcome: >
      Once a club has been picked, the game is saved in the browser automatically, with no Save
      button, after every tap that changes it: picking the club, choosing a formation in "Tactics",
      picking a player for a "Starting XI" slot, and "Play match". The saved game holds the league's
      seed, the managed club, the formation, the Starting XI (including the player's own picks) and the
      recorded results; which screen was open is not saved. When a saved game exists, the title screen
      shows a button named exactly "Continue" (44px or taller) above the button named exactly "New
      game"; its only top-level heading (h1) still reads "Gaffer", focused on load. On a first visit,
      or in a fresh browser, there is no "Continue" button and the title screen is as before. Tapping
      "Continue" shows the club home of the saved club with focus on its heading, the club's name, and
      everything is as it was before the reload: "Table" shows the table named "League table" with the
      same rows, the same text in every cell; "Tactics" has the saved formation checked ("4-4-2",
      "4-3-3" or "4-2-3-1"); "Starting XI" lists the same 11 slot texts in the same order; and when N
      matches had been played, the next "Play match" shows the match screen whose h1 reads "Matchday
      N+1" (after two matches, "Matchday 3"). When all 14 had been played, the club home shows "End of
      season" and no "Play match", and the End of season screen shows the same "Final position" and
      "Top scorer" lines. "Back" works on every screen as before. Saving and continuing changes nothing
      in the game: the rest of the season played after "Continue" gives the same match screens (the
      score line and the "Goals" list) and the same table as the same seed, club and choices played in
      one visit without a reload. There is one saved game: "Continue" resumes it whatever "?seed=" the
      address holds now. "New game" still starts a fresh game from the address's seed exactly as
      before: after picking a club the table reads P 0, W 0, D 0, L 0, GD 0 and Pts 0 on every row in A
      to Z order, "Tactics" has "4-4-2" checked, the Starting XI is the automatic one, and the next
      "Play match" shows "Matchday 1". Tapping "New game" or "Play again" does not by itself remove the
      saved game; it is replaced as soon as a club is picked in the new game. A saved game that cannot
      be read (damaged, or from an incompatible older version) is ignored: there is no "Continue" button
      and the game plays as before. When browser storage is unavailable or full, there is no "Continue"
      button and the game plays as before without saving; a failed save never interrupts play. This
      version amends S-007, S-008 and S-009, which said that results are kept until the page is
      reloaded: from this version on a reload keeps the saved game, reachable through "Continue"; their
      durable lists are unchanged and "New game" still starts fresh. These hold in every later version
      of the game: with a saved game the title screen offers "Continue" (exact name), and without one it
      does not; "Continue" restores the saved club with its formation, Starting XI, recorded results and
      next matchday; and "New game" always starts a fresh game. That "Continue" lands on the club home,
      and that the saved game is replaced only once a club is picked in a new game, are rules of this
      version only. No horizontal scroll at 390px and no console errors.
