# nWave-owned story queue, written by the factory's plan runs (AI-reviewed, auto-merged).
# Delivered strictly in order. A story is DONE only when tests/protected/<id>/ scenarios pass on main.
# Protected scenarios are append-only: once merged they can never be edited or deleted.
# Out-of-scope tags are forbidden; the list lives in factory/config.json (owner-only).
#
# Story shape:
#   - id: S-001          # S-NNN, never reused
#     week: 0            # target demo week
#     title: ...
#     tags: [...]
#     outcome: >         # what the player can do afterwards, observable on a phone
#       ...

stories:
  - id: S-001
    week: 0
    title: Start a new game and pick a club
    tags: [onboarding, league]
    outcome: >
      From the title screen the player taps "New game" and sees a screen with a heading and a list
      named "Clubs" holding the 8 clubs of a generated fictional league. Each club appears as one
      tappable button (44px or taller) whose first line of text is the club's unique name, with the
      club's two colours shown as a decorative swatch (hidden from screen readers; not
      black-box tested). Tapping a club lands on that club's home screen, whose
      heading shows the club's name. The league comes from a seed: opening the game with the same
      "?seed=" in the address always generates the same league, different seeds generate different
      leagues, and without a valid seed the game uses a fixed default seed. Each screen has exactly one
      top-level heading. No horizontal scroll at 390px.

  - id: S-002
    week: 1
    title: View my squad
    tags: [squad]
    outcome: >
      From the club home screen the player taps "Squad" and sees a list named "Squad" with the club's
      18 generated players. Each row shows, in this order, the player's name, position (GK, DF, MF or
      FW), age (16-40) and overall rating (1-20); age and overall are the first two numbers in the
      row. Every club's squad has at least 2 goalkeepers and players in every position, and every
      club has different players. A button named exactly "Back" returns to the club home screen. The squad comes from the same seed as the league, so it is identical on every
      visit with the same seed. No horizontal scroll at 390px.

  - id: S-003
    week: 1
    title: View a player's details
    tags: [squad]
    outcome: >
      In the list named "Squad" each of the 18 player rows holds exactly one tappable button (44px or
      taller) whose text still reads name, position, age, overall (age and overall the first two
      numbers). Tapping a row, whatever its position (GK, DF, MF or FW), opens that player's screen:
      exactly one heading, the player's name, and the lines "Position" (GK, DF, MF or FW), "Age" and
      "Overall", each read as one line of text (label, one space, value, for example "Position GK",
      "Age 27", "Overall 14") with the same values as the tapped row. A list named "Attributes" holds
      exactly 4 items, "Goalkeeping", "Defending", "Passing" and "Shooting" in that order, each read as
      the attribute name, one space and a whole number from 1 to 20 (for example "Goalkeeping 15"),
      with no other number. The overall is at least the player's lowest and at most their highest
      attribute. Outside that list a line reads "Condition" followed by a whole percentage from 0 to
      100 (for example "Condition 92%"). A button named exactly "Back" (44px or taller) returns to the
      same club's squad list (heading the club's name, 18 players); "Back" there still returns to the
      club home. After each tap, focus moves to the new screen's heading. The player screen comes from the same seed as the league, so it is identical on every
      visit with the same seed, also when the seed is invalid and the default is used, and the players
      of a squad do not all share the same attributes. No horizontal scroll at 390px and no console
      errors.

  - id: S-004
    week: 2
    title: Choose a formation
    tags: [tactics]
    outcome: >
      From the club home screen the player taps a button named exactly "Tactics" (44px or taller) and
      sees a screen whose only heading is "Tactics", with focus on that heading. A radio group named
      "Formation" holds exactly three radio buttons named "4-4-2", "4-3-3" and "4-2-3-1", in that order;
      each radio's visible label is its formation name and is 44px or taller, and tapping the label
      checks that radio. Exactly one is checked, and in a new game (from "New game" on the title screen)
      it is "4-4-2". A list named "Line-up" holds exactly 11 items, each reading exactly one position code
      (GK, DF, MF or FW), goalkeeper first, then defenders, midfielders and forwards: 4-4-2 is 1 GK, 4 DF,
      4 MF, 2 FW; 4-3-3 is 1 GK, 4 DF, 3 MF, 3 FW; 4-2-3-1 is 1 GK, 4 DF, 5 MF, 1 FW. Tapping a formation
      checks it, unchecks the others and updates the list at once, while the heading stays "Tactics" and
      focus is on the tapped formation's radio button. A button named exactly "Back" (44px or taller)
      returns to the club home (heading the club's name). The choice is kept for the rest of the session:
      tapping "Tactics" again, also after visiting "Squad", shows the same formation checked with its
      line-up. The line-ups do not depend on the seed (the same for "?seed=31" and "?seed=abc"). No
      horizontal scroll at 390px and no console errors.
